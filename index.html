<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebClient</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-chat-endpoint="https://17iwi3fpi4.execute-api.us-east-2.amazonaws.com/chat/send"
    data-history-endpoint="https://17iwi3fpi4.execute-api.us-east-2.amazonaws.com/chat/history"
    data-socio-id="1234567"
  >
    <main class="app-shell" aria-label="Contenedor principal">
      <iframe
        class="content-frame"
        src="https://dotavip.net"
        title="Dotavip"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>

    <button
      id="chat-toggle"
      class="chat-toggle"
      type="button"
      aria-controls="chat-panel"
      aria-expanded="false"
      aria-label="Abrir chat"
    >
      <span class="chat-toggle__badge" aria-hidden="true">Dr</span>
    </button>

    <aside
      id="chat-panel"
      class="chat-panel"
      aria-hidden="true"
      aria-labelledby="chat-title"
    >
      <header class="chat-header">
        <div class="chat-profile">
          <div class="chat-avatar" aria-hidden="true">Dr</div>
          <div>
            <p class="chat-agent">Dr.Beting</p>
            <p id="chat-status" class="chat-status">Inicia sesión para abrir el chat</p>
          </div>
        </div>
        <button
          id="chat-close"
          class="chat-close"
          type="button"
          aria-label="Cerrar chat"
        >
          ×
        </button>
      </header>

      <section id="chat-auth" class="chat-auth">
        <div class="chat-auth__hero" aria-hidden="true">✦</div>
        <h1 id="chat-title">Identificación</h1>
        <p class="chat-auth__copy">
          Bienvenido. Ingresa tu cuenta para iniciar sesión y abrir el chat.
        </p>

        <form id="login-form" class="login-form">
          <label>
            <span>Email</span>
            <input
              id="login-email"
              name="email"
              type="email"
              placeholder="mario@test.com"
              autocomplete="username"
              required
            />
          </label>
          <label>
            <span>Contraseña</span>
            <input
              id="login-password"
              name="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </label>
          <button id="login-submit" class="chat-cta" type="submit">Entra aquí</button>
        </form>

        <div class="chat-auth__links">
          <a href="#referido" class="chat-auth__link js-placeholder-link">🔴 ¿Tenés código de referido?</a>
          <a href="#contrasena" class="chat-auth__link js-placeholder-link">🔑 Olvidé mi contraseña</a>
        </div>
      </section>

      <section id="chat-session" class="chat-session" hidden>
        <section id="chat-messages" class="chat-messages" aria-live="polite"></section>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="chat-input">Escribe tu mensaje</label>
          <textarea
            id="chat-input"
            name="message"
            rows="1"
            maxlength="1000"
            placeholder="Escribe tu mensaje..."
            required
          ></textarea>
          <button id="chat-submit" type="submit">Enviar</button>
        </form>
      </section>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
